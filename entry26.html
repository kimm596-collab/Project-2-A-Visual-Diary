<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>felt — a visual diary</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#f9f9f7; }

  .top-bar {
    position:fixed; top:2rem; left:0; right:0;
    display:flex; justify-content:space-between;
    padding:0 2.5rem; z-index:10;
  }
  .entry-label {
    font-family:'Josefin Sans',sans-serif; font-weight:100;
    font-size:0.85rem; letter-spacing:0.18em; color:#555; text-transform:lowercase;
  }
  .entry-date {
    font-family:'Josefin Sans',sans-serif; font-weight:100;
    font-size:0.85rem; letter-spacing:0.1em; color:#aaa;
  }

  #stage { position:fixed; inset:0; }

  .word-item {
    position:absolute;
    font-family:'EB Garamond',Georgia,serif;
    font-style:normal;
    font-weight:600;
    color:#1c2b2b;
    white-space:nowrap;
    text-align:center;
    opacity:0;
    transition:opacity 0.45s ease;
  }
  .word-item.in { opacity:1; }

  @keyframes floatA {
    0%   { transform: translate(-50%,-50%) translateY(0px); }
    50%  { transform: translate(-50%,-50%) translateY(-6px); }
    100% { transform: translate(-50%,-50%) translateY(0px); }
  }
  @keyframes floatB {
    0%   { transform: translate(-50%,-50%) translateY(0px); }
    50%  { transform: translate(-50%,-50%) translateY(-9px); }
    100% { transform: translate(-50%,-50%) translateY(0px); }
  }
  @keyframes floatC {
    0%   { transform: translate(-50%,-50%) translateY(0px); }
    50%  { transform: translate(-50%,-50%) translateY(-4px); }
    100% { transform: translate(-50%,-50%) translateY(0px); }
  }
</style>
</head>
<body>

<div class="top-bar">
  <span class="entry-label">felt</span>
  <span class="entry-date" id="entryDate"></span>
</div>
<div id="stage"></div>

<script>
// @ts-nocheck

var FALLBACK = [
  'tender','restless','alive','hollow','warm',
  'grief','free','anxious','content','wistful',
  'numb','electric','soft','longing','present',
  'aching','calm','raw','hopeful','heavy',
  'still','melancholy','open','burning','relief'
];

function getWords() {
  var words = [];
  for (var i = 1; i <= 25; i++) {
    var w = sessionStorage.getItem('entry' + i);
    if (w && w.trim()) words.push(w.trim());
  }
  return words.length > 0 ? words : FALLBACK;
}

// Sample a point along a cubic bezier curve at parameter t
function bezierPoint(t, p0, p1, p2, p3) {
  var mt = 1 - t;
  return {
    x: mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x,
    y: mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y
  };
}

function build() {
  var words = getWords();
  var stage = document.getElementById('stage');
  var W = window.innerWidth;
  var H = window.innerHeight;

  // Date
  var mm = sessionStorage.getItem('mm') || '';
  var dd = sessionStorage.getItem('dd') || '';
  var yy = sessionStorage.getItem('yy') || '';
  if (mm && dd && yy) {
    document.getElementById('entryDate').textContent = mm + ' / ' + dd + ' / ' + yy;
  }

  // Define a curved bezier path from bottom-left to top-right
  // Like the reference: starts bottom-left, curves through center, ends top-right
  // Entry 1 = bottom-left (t=0), Entry 25 = top-right (t=1)
  var p0 = { x: W * 0.06,  y: H * 0.90 }; // bottom-left start
  var p1 = { x: W * 0.18,  y: H * 0.55 }; // control point 1 — pulls left-center
  var p2 = { x: W * 0.62,  y: H * 0.48 }; // control point 2 — pushes right-center
  var p3 = { x: W * 0.95,  y: H * 0.06 }; // top-right end

  var n = words.length;

  // All words same size — roughly "calm" which was at t=0.5 ≈ 1.1rem
  var baseSize = 1.1;

  // Uneven spacing along the curve — some words cluster, some breathe
  // Pre-define irregular t values instead of even spacing
  var tValues = [];
  var pos = 0;
  for (var i = 0; i < n; i++) {
    // Random step size between 0.02 and 0.08 — creates organic gaps
    var step = 0.025 + Math.random() * 0.055;
    pos += step;
    tValues.push(pos);
  }
  // Normalize to 0→1
  var maxT = tValues[tValues.length - 1];
  for (var i = 0; i < tValues.length; i++) {
    tValues[i] = tValues[i] / maxT;
  }

  for (var i = 0; i < n; i++) {
    var t = tValues[i];

    // Position along curve
    var pt = bezierPoint(t, p0, p1, p2, p3);

    // ALL words same size — like "calm" in the middle
    var fontSize = baseSize;

    // Weight consistent
    var weight = '500';

    // Ethereal opacity — very varied, some almost invisible
    var alpha = 0.18 + Math.random() * 0.62;

    // Letter spacing: slight variation for raw feel
    var ls = 0.01 + Math.random() * 0.03;

    // Random float animation
    var floats = ['floatA', 'floatB', 'floatC'];
    var floatAnim = floats[Math.floor(Math.random() * floats.length)];
    var floatDur  = (4 + Math.random() * 6).toFixed(1);
    var floatDelay = (Math.random() * 4).toFixed(1);

    var el = document.createElement('div');
    el.className = 'word-item';
    el.textContent = words[i];
    el.style.fontSize      = fontSize + 'rem';
    el.style.fontWeight    = weight;
    el.style.color         = 'rgba(28,43,43,' + alpha + ')';
    el.style.letterSpacing = ls + 'em';
    el.style.left          = pt.x + 'px';
    el.style.top           = pt.y + 'px';
    el.style.transform     = 'translate(-50%, -50%)';
    el.style.animation     = floatAnim + ' ' + floatDur + 's ease-in-out ' + floatDelay + 's infinite';

    stage.appendChild(el);
  }

  // Reveal from bottom (entry 1) to top (entry 25)
  var items = stage.querySelectorAll('.word-item');
  for (var j = 0; j < items.length; j++) {
    (function(el, delay) {
      setTimeout(function() { el.classList.add('in'); }, delay);
    })(items[j], j * 80 + 150);
  }
}

document.addEventListener('DOMContentLoaded', build);
</script>
</body>
</html>
