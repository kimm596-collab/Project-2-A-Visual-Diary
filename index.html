<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a visual diary</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #fff;
    color: #1a1a1a;
    font-family: 'Josefin Sans', sans-serif;
  }

  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
    animation: appear 1.4s ease forwards;
  }

  .cover-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: clamp(2.4rem, 7vw, 5.8rem);
    font-weight: 100;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.75);
    line-height: 1;
    text-align: center;
    white-space: nowrap;
    margin-bottom: 3.5rem;
    user-select: none;
    pointer-events: none;
  }

  .cover-input-wrap {
    position: relative;
    width: min(320px, 78vw);
  }

  .datetime-field {
    width: 100%;
    border: 1px solid rgba(0,0,0,0.18);
    padding: 0.65rem 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: text;
    transition: border-color 0.25s;
    min-height: 46px;
    gap: 0.5rem;
  }
  .datetime-field:focus-within {
    border-color: rgba(0,0,0,0.45);
  }

  .dt-placeholder {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 0.72rem;
    font-style: normal;
    font-weight: 100;
    letter-spacing: 0.22em;
    color: rgba(0,0,0,0.35);
    text-transform: lowercase;
    pointer-events: none;
  }

  .dt-active {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    color: #1a1a1a;
  }

  .dt-seg {
    border: none; outline: none; background: none;
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    color: #1a1a1a;
    text-align: center;
    caret-color: #1a1a1a;
    padding: 0;
    cursor: text;
  }
  .dt-seg::placeholder { color: rgba(0,0,0,0.3); }
  .dt-seg:focus {
    color: #000;
    text-align: left;
  }

  .dt-sep {
    color: rgba(0,0,0,0.3);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 0.82rem;
    user-select: none;
  }

  .dt-ampm {
    display: flex; gap: 0.15rem; margin-left: 0.4rem;
  }
  .dt-ampm span {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: rgba(0,0,0,0.25);
    cursor: pointer;
    padding: 0.1rem 0.25rem;
    transition: color 0.15s;
    user-select: none;
  }
  .dt-ampm span.selected { color: #1a1a1a; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="cover-title">A VISUAL DIARY</div>
  <div class="cover-input-wrap">
    <div class="datetime-field" id="dtField">
      <span class="dt-placeholder" id="dtPlaceholder">enter date &amp; time</span>
      <div class="dt-active" id="dtActive">
        <input class="dt-seg" id="segMM"  maxlength="2" placeholder="MM"   style="width:1.6rem" />
        <span class="dt-sep">/</span>
        <input class="dt-seg" id="segDD"  maxlength="2" placeholder="DD"   style="width:1.6rem" />
        <span class="dt-sep">/</span>
        <input class="dt-seg" id="segYY"  maxlength="4" placeholder="YYYY" style="width:2.6rem" />
        <span class="dt-sep" style="margin:0 0.3rem">&amp;</span>
        <input class="dt-seg" id="segHH"  maxlength="2" placeholder="00"   style="width:1.6rem" />
        <span class="dt-sep">:</span>
        <input class="dt-seg" id="segMin" maxlength="2" placeholder="00"   style="width:1.6rem" />
        <div class="dt-ampm">
          <span id="amBtn" onclick="setAMPM('AM',event)" class="selected">AM</span>
          <span id="pmBtn" onclick="setAMPM('PM',event)">PM</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let ampm = 'AM';

function activateDT() {
  document.getElementById('dtPlaceholder').style.display = 'none';
  document.getElementById('dtActive').style.display = 'flex';
  setTimeout(() => document.getElementById('segMM').focus(), 10);
}

function setAMPM(val, e) {
  if (e) e.stopPropagation();
  ampm = val;
  document.getElementById('amBtn').classList.toggle('selected', val === 'AM');
  document.getElementById('pmBtn').classList.toggle('selected', val === 'PM');

  const fields = ['segMM','segDD','segYY','segHH','segMin'];
  const allFilled = fields.every(id => document.getElementById(id).value.trim().length > 0);
  if (allFilled) {
    setTimeout(() => goToDiary(), 180);
  }
}

function goToDiary() {
  const app = document.getElementById('app');
  app.style.transition = 'opacity .6s ease';
  app.style.opacity = '0';
  setTimeout(() => {
    window.location.href = 'entry1.html';
  }, 600);
}

document.addEventListener('DOMContentLoaded', () => {
  const segs = [
    { el: 'segMM',  max: 2, next: 'segDD'  },
    { el: 'segDD',  max: 2, next: 'segYY'  },
    { el: 'segYY',  max: 4, next: 'segHH'  },
    { el: 'segHH',  max: 2, next: 'segMin' },
    { el: 'segMin', max: 2, next: null      },
  ];

  segs.forEach(({ el, max, next }) => {
    const input = document.getElementById(el);
    input.addEventListener('focus', () => {
      setTimeout(() => { input.value = ''; input.setSelectionRange(0,0); }, 0);
    });
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '');
      if (input.value.length >= max && next) {
        document.getElementById(next).focus();
      }
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') goToDiary();
    });
  });

  document.getElementById('dtField').addEventListener('click', () => {
    if (document.getElementById('dtActive').style.display === 'flex') return;
    activateDT();
  });
});
</script>
</body>
</html>
