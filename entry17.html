<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>entry 12 — a visual diary</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: #1a1a1a; font-family: 'EB Garamond', Georgia, serif; }

  #page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
    animation: appear 0.8s ease forwards;
  }

  .top-bar {
    position: fixed; top: 2rem; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 2.5rem; align-items: baseline;
  }
  .entry-label {
    font-family: 'Josefin Sans', sans-serif; font-weight: 100;
    font-size: 0.85rem; letter-spacing: 0.18em; color: #555; text-transform: lowercase;
  }
  .entry-count {
    font-family: 'Josefin Sans', sans-serif; font-weight: 100;
    font-size: 0.85rem; letter-spacing: 0.1em; color: #555;
  }

  .prompt-wrap {
    max-width: 580px; width: 100%;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .prompt-q {
    font-family: 'Josefin Sans', sans-serif;
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    font-weight: 100; font-style: normal;
    letter-spacing: 0.06em; line-height: 1.65;
    color: #1a1a1a; margin-bottom: 2rem;
  }

  .word-pool-wrap { position: relative; width: 100%; height: 200px; margin-bottom: 1.8rem; }
  .word-pool { position: relative; width: 100%; height: 100%; }
  .word-item {
    position: absolute; font-family: 'EB Garamond', Georgia, serif;
    color: #d4d4d4; cursor: default; user-select: none;
    white-space: nowrap; pointer-events: none; opacity: 0;
    animation: drift linear infinite, fadeIn 0.8s ease forwards;
  }
  @keyframes drift { 0% { transform: translateY(0); } 45% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .feeling-input-wrap { width: min(240px, 62vw); }
  .feeling-label {
    font-family: 'Josefin Sans', sans-serif; font-weight: 100;
    font-size: 0.68rem; letter-spacing: 0.18em; color: rgba(0,0,0,0.45);
    text-transform: lowercase; margin-bottom: 0.5rem;
  }
  .feeling-field {
    width: 100%; border: 1px solid rgba(0,0,0,0.22);
    padding: 0.55rem 1rem; display: flex; align-items: center;
    justify-content: center; cursor: text; transition: border-color .25s; min-height: 40px;
  }
  .feeling-field:focus-within { border-color: rgba(0,0,0,0.5); }
  .feeling-field input {
    width: 100%; background: none; border: none; outline: none;
    font-family: 'EB Garamond', Georgia, serif; font-size: 1rem;
    font-style: italic; color: #1a1a1a; text-align: center;
    caret-color: #1a1a1a; letter-spacing: 0.04em;
  }
  .feeling-field input::placeholder { color: rgba(0,0,0,0.3); font-style: italic; }
  .feeling-field input:focus { text-align: left; }

  #veil { position: fixed; inset: 0; z-index: 100; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #veil.on { opacity: 1; pointer-events: all; }

  @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="veil"></div>

<div id="page">
  <div class="top-bar">
    <span class="entry-label">entry 17</span>
    <span class="entry-count">17 / 25</span>
  </div>

  <div class="prompt-wrap">
    <div class="prompt-q">What do you feel looking out a window on a rainy day?</div>

    <div class="word-pool-wrap">
      <div class="word-pool" id="wordPool"></div>
    </div>

    <div class="feeling-input-wrap">
      <div class="feeling-label">choose from pool and type below</div>
      <div class="feeling-field" id="feelingField">
        <input type="text" id="feelingInput" placeholder="enter a feeling"
          maxlength="30" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>
</div>

<script>
const POOL_WORDS = [
  "calm","quiet","noise","worry","laziness","anxious","disappintment",
  "boredom","empty","groggy","comfort","loneliness","indifference",
  "pissed","moody","frustrated","bitter","weariness","unmotivated","sluggish",
  "wary","worried","restlessness","acceptance","unbothered"
];

function spawnWords() {
  const pool = document.getElementById('wordPool');
  const PW = pool.offsetWidth, PH = pool.offsetHeight;
  const shuffled = [...POOL_WORDS].sort(() => Math.random() - 0.5);
  shuffled.forEach((word, i) => {
    const span = document.createElement('span');
    span.className = 'word-item';
    span.textContent = word;
    span.style.fontSize = (1.0 + Math.random() * 0.8) + 'rem';
    span.style.fontStyle = Math.random() > 0.4 ? 'italic' : 'normal';
    span.style.animationDelay = `${i * 0.06}s, ${Math.random() * 0.4}s`;
    span.style.animationDuration = `${4 + Math.random() * 7}s, 0.7s`;
    span.style.left = (4 + Math.random() * (PW - 150)) + 'px';
    span.style.top  = (4 + Math.random() * (PH - 32)) + 'px';
    pool.appendChild(span);
  });
}

function goToShape(word) {
  sessionStorage.setItem('entry17', word);

  const veil = document.getElementById('veil');
  veil.classList.add('on');

  const label = document.querySelector('.entry-label').textContent;
  const current = parseInt(label.match(/\d+/)[0], 10);
  const next = current + 1;

  setTimeout(() => {
    window.location.href = `entry18.html`;
  }, 500);
}

document.addEventListener('DOMContentLoaded', () => {
  spawnWords();
  const input = document.getElementById('feelingInput');
  input.focus();

  let typingTimer = null;
  input.addEventListener('input', () => {
    window.clearTimeout(typingTimer);
    const val = input.value.trim();
    if (!val) return;
    typingTimer = window.setTimeout(() => {
      const v = input.value.trim();
      if (v) goToShape(v);
    }, 1200);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      window.clearTimeout(typingTimer);
      const val = input.value.trim();
      if (val) goToShape(val);
    }
  });

  document.getElementById('feelingField').addEventListener('click', () => input.focus());
});
</script>
</body>
</html>
